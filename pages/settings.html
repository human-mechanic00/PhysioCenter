<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإعدادات</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content full"><div class="topbar"><h1>⚙️ الإعدادات</h1><button onclick="location.href='dashboard.html'">الرئيسية</button></div><form id="f" class="panel form-grid"><label>اسم المركز<input name="clinic_name"></label><label>سعر الجلسة الافتراضي<input name="default_session_price" type="number" min="0"></label><label>العملة<input name="currency"></label><div class="wide"><button class="primary">حفظ</button></div><div id="m" class="wide"></div></form><script>const u=JSON.parse(sessionStorage.getItem('physioUser')||'null');if(!u||u.role!=='doctor')location.href='dashboard.html';(async()=>{const r=await window.physio.settings.get();Object.entries(r.data||{}).forEach(([k,v])=>{if(f.elements[k])f.elements[k].value=v});f.onsubmit=async e=>{e.preventDefault();const x=await window.physio.settings.save(Object.fromEntries(new FormData(f)));m.textContent=x.ok?'تم الحفظ':'حدث خطأ';m.className=x.ok?'success':'error'}})()</script></main></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سجل التعديلات</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content full"><div class="topbar"><h1>🛡️ سجل التعديلات</h1><button onclick="location.href='dashboard.html'">الرئيسية</button></div><div class="panel table-wrap"><table><thead><tr><th>المستخدم</th><th>الإجراء</th><th>النوع</th><th>رقم</th><th>التاريخ</th></tr></thead><tbody id="t"></tbody></table></div><script>(async()=>{const u=JSON.parse(sessionStorage.getItem('physioUser')||'null');if(!u||u.role!=='doctor')location.href='dashboard.html';const r=await window.physio.audit.list();t.innerHTML=r.map(x=>`<tr><td>${x.username||'-'}</td><td>${x.action}</td><td>${x.entity||'-'}</td><td>${x.entity_id||'-'}</td><td>${x.created_at}</td></tr>`).join('')})()</script></main><button class="back-button" type="button" onclick="history.back()" title="رجوع">← رجوع</button></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقييمات المرضى</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content full"><div class="topbar"><h1>⭐ تقييمات المرضى</h1><button onclick="location.href='dashboard.html'">الرئيسية</button></div><div id="summary" class="cards"></div><div class="panel table-wrap"><table><thead><tr><th>المريض</th><th>التعامل</th><th>المواعيد</th><th>الشرح</th><th>الخدمة</th><th>الاستقبال</th><th>النظافة</th><th>التعليق</th></tr></thead><tbody id="t"></tbody></table></div><script>async function load(){const [r,s]=await Promise.all([window.physio.feedback.list(),window.physio.feedback.summary()]);if(s.ok){const x=s.data;summary.innerHTML=[['⭐','التقييم العام',x.overall||0+'/5'],['👨‍⚕️','التعامل',x.therapist||0+'/5'],['📅','المواعيد',x.appointment||0+'/5'],['🧹','النظافة',x.cleanliness||0+'/5']].map(a=>`<div class="stat"><div class="stat-icon">${a[0]}</div><div><div class="muted">${a[1]}</div><strong>${a[2]}</strong></div></div>`).join('')}t.innerHTML=r.map(x=>`<tr><td>${x.full_name}</td><td>${x.therapist_rating}/5</td><td>${x.appointment_rating}/5</td><td>${x.explanation_rating}/5</td><td>${x.service_rating}/5</td><td>${x.reception_rating}/5</td><td>${x.cleanliness_rating}/5</td><td>${x.comment||'-'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">لا توجد تقييمات</td></tr>'}load()</script></main><button class="back-button" type="button" onclick="history.back()" title="رجوع">← رجوع</button></body></html>

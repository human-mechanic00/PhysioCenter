<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحسابات</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content full"><div class="topbar"><h1>💰 الحسابات</h1><button onclick="location.href='dashboard.html'">الرئيسية</button></div><div id="stats" class="cards"></div><div class="grid2"><form id="pay" class="panel form-grid"><h2 class="wide">تسجيل دفعة</h2><label>المريض<select name="patient_id" id="patient"></select></label><label>المبلغ<input name="amount" type="number" min="0" step="0.01" required></label><label class="wide">ملاحظات<textarea name="notes"></textarea></label><button class="primary">حفظ الدفعة</button></form><form id="exp" class="panel form-grid"><h2 class="wide">تسجيل مصروف</h2><label>المبلغ<input name="amount" type="number" min="0" step="0.01" required></label><label>التصنيف<input name="category"></label><label class="wide">ملاحظات<textarea name="notes"></textarea></label><button class="primary">حفظ المصروف</button></form></div><script>const u=JSON.parse(sessionStorage.getItem('physioUser')||'null');if(!u||u.role!=='doctor')location.href='dashboard.html';async function load(){const r=await window.physio.finance.summary();if(!r.ok)return alert(r.message);const s=r.data;stats.innerHTML=[['إيراد اليوم',s.today],['إيراد الشهر',s.month],['مصروفات الشهر',s.expenses],['صافي الربح',s.profit]].map(x=>`<div class="stat"><div class="muted">${x[0]}</div><strong>${Number(x[1]).toFixed(2)} جنيه</strong></div>`).join('');patient.innerHTML=(await window.physio.patients.list('')).map(p=>`<option value="${p.id}">${p.full_name}</option>`).join('')}pay.onsubmit=async e=>{e.preventDefault();const r=await window.physio.finance.addPayment(Object.fromEntries(new FormData(pay)));if(!r.ok)alert(r.message);else{pay.reset();load()}};exp.onsubmit=async e=>{e.preventDefault();const r=await window.physio.finance.addExpense(Object.fromEntries(new FormData(exp)));if(!r.ok)alert(r.message);else{exp.reset();load()}};load()</script></main><button class="back-button" type="button" onclick="history.back()" title="رجوع">← رجوع</button></body></html>

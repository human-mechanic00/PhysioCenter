<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المستخدمون</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content full"><div class="topbar"><h1>👤 المستخدمون</h1><button onclick="location.href='dashboard.html'">الرئيسية</button></div><form id="f" class="panel form-grid"><label>اسم المستخدم<input name="username" required></label><label>كلمة المرور<input name="password" type="password" minlength="4" required></label><label>الدور<select name="role"><option value="center">المركز</option><option value="doctor">الدكتور</option></select></label><button class="primary">إضافة</button></form><div class="panel"><h2>تغيير كلمة مرور حسابي</h2><form id="pw" class="form-grid"><label>كلمة المرور الجديدة<input name="password" type="password" minlength="4" required></label><button class="primary">تغيير كلمة المرور</button><div id="pm" class="wide"></div></form></div><div class="panel table-wrap"><table><thead><tr><th>المستخدم</th><th>الدور</th><th>الحالة</th><th></th></tr></thead><tbody id="t"></tbody></table></div><script>const u=JSON.parse(sessionStorage.getItem('physioUser')||'null');if(!u||u.role!=='doctor')location.href='dashboard.html';async function load(){t.innerHTML=(await window.physio.users.list()).map(x=>`<tr><td>${x.username}</td><td>${x.role==='doctor'?'الدكتور':'المركز'}</td><td>${x.active?'نشط':'متوقف'}</td><td><button onclick="toggleUser(${x.id})">تغيير الحالة</button></td></tr>`).join('')}async function toggleUser(id){const r=await window.physio.users.toggle(id);if(!r.ok)alert(r.message);else load()}pw.onsubmit=async e=>{e.preventDefault();const r=await window.physio.users.changePassword(u.id,e.target.password.value);pm.textContent=r.ok?'تم تغيير كلمة المرور بنجاح':r.message;pm.className=r.ok?'success':'error';if(r.ok)e.target.reset()};f.onsubmit=async e=>{e.preventDefault();const r=await window.physio.users.add(Object.fromEntries(new FormData(f)));if(!r.ok)alert(r.message);else{f.reset();load()}};load()</script></main></body></html>

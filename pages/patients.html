<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المرضى</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content full"><div class="topbar"><h1>👥 المرضى</h1><button onclick="location.href='dashboard.html'">الرئيسية</button></div><div class="toolbar"><input id="q" placeholder="ابحث بالاسم أو رقم الملف أو الهاتف"><button class="primary" onclick="location.href='patient-form.html'">+ مريض جديد</button></div><div class="panel table-wrap"><table><thead><tr><th>رقم الملف</th><th>الاسم</th><th>الهاتف</th><th>التشخيص</th><th>الحالة</th><th></th></tr></thead><tbody id="t"></tbody></table></div><script>const u=JSON.parse(sessionStorage.getItem('physioUser')||'null');if(!u)location.href='login.html';async function load(){const r=await window.physio.patients.list(q.value);t.innerHTML=r.map(p=>`<tr><td>${p.file_no}</td><td>${p.full_name}</td><td>${p.phone||'-'}</td><td>${p.diagnosis||'-'}</td><td>${p.status==='active'?'نشط':'مؤرشف'}</td><td><button onclick="location.href='patient.html?id=${p.id}'">فتح الملف</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">لا يوجد مرضى</td></tr>'}q.oninput=load;load()</script></main></body></html>

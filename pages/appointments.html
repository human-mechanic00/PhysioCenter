<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المواعيد</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content full"><div class="topbar"><h1>📅 المواعيد</h1><button onclick="location.href='dashboard.html'">الرئيسية</button></div><div class="toolbar"><input id="date" type="date"><button id="new" class="primary">+ حجز موعد</button></div><div id="formbox" class="panel hidden"><form id="f" class="form-grid"><label>المريض<select name="patient_id" id="patient" required></select></label><label>التاريخ والوقت<input name="appointment_date" type="datetime-local" required></label><label class="wide">ملاحظات<textarea name="notes"></textarea></label><button class="primary">حفظ الموعد</button></form></div><div class="panel table-wrap"><table><thead><tr><th>الوقت</th><th>المريض</th><th>الهاتف</th><th>الحالة</th><th></th></tr></thead><tbody id="t"></tbody></table></div><script>date.value=new Date().toISOString().slice(0,10);async function load(){const r=await window.physio.appointments.list(date.value);t.innerHTML=r.map(a=>`<tr><td>${a.appointment_date}</td><td>${a.full_name}</td><td>${a.phone||'-'}</td><td>${a.status}</td><td><select onchange="setStatus(${a.id},this.value)"><option>scheduled</option><option>attended</option><option>absent</option><option>cancelled</option></select></td></tr>`).join('')||'<tr><td colspan="5">لا توجد مواعيد</td></tr>'}async function setStatus(id,s){await window.physio.appointments.status(id,s);load()}new.onclick=async()=>{formbox.classList.remove('hidden');const ps=await window.physio.patients.list('');patient.innerHTML=ps.map(p=>`<option value="${p.id}">${p.file_no} — ${p.full_name}</option>`).join('')};f.onsubmit=async e=>{e.preventDefault();await window.physio.appointments.add(Object.fromEntries(new FormData(f)));formbox.classList.add('hidden');load()};date.onchange=load;load()</script></main></body></html>

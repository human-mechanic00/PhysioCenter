<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل الدخول - Physio Center</title><link rel="stylesheet" href="../css/style.css"></head><body class="login"><div class="login-card"><div class="brand">🏥</div><h1>Physio Center</h1><p class="muted">نظام إدارة مركز العلاج الطبيعي</p><form id="f"><label>اسم المستخدم<input name="username" required autocomplete="username"></label><label>كلمة المرور<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">دخول</button><div id="m"></div></form><small class="muted">للتجربة: doctor / 1234 أو center / 1234</small></div><script>f.onsubmit=async e=>{e.preventDefault();const r=await window.physio.login(Object.fromEntries(new FormData(f)));if(r.ok){sessionStorage.setItem('physioUser',JSON.stringify(r.user));location.href='dashboard.html'}else m.className='error',m.textContent=r.message}</script></body></html>

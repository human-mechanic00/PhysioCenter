<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التقارير</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content full"><div class="topbar"><h1>📊 التقارير</h1><div class="actions"><button onclick="location.href='dashboard.html'">الرئيسية</button><button onclick="window.print()">🖨️ طباعة</button></div></div><section class="panel"><div class="toolbar"><label>من<input id="from" type="date"></label><label>إلى<input id="to" type="date"></label><button class="primary" id="load">تحديث التقرير</button></div></section><div id="cards" class="cards"></div><section class="panel"><h2>ملخص الفترة</h2><div id="details"></div></section></main><script>const u=JSON.parse(sessionStorage.getItem('physioUser')||'null');if(!u||u.role!=='doctor')location.href='dashboard.html';const today=new Date(),first=new Date(today.getFullYear(),today.getMonth(),1);from.value=first.toISOString().slice(0,10);to.value=today.toISOString().slice(0,10);async function load(){const r=await window.physio.reports.get({from:from.value,to:to.value});if(!r.ok)return alert(r.message);const x=r.data;cards.innerHTML=[['👥','المرضى النشطون',x.patients],['📝','الجلسات',x.sessions],['✅','الحضور',x.attended],['❌','الغياب',x.absent],['💰','الإيرادات',Number(x.revenue).toFixed(2)+' جنيه'],['💸','المصروفات',Number(x.expenses).toFixed(2)+' جنيه'],['📈','صافي الربح',Number(x.profit).toFixed(2)+' جنيه']].map(a=>`<div class="stat"><div class="stat-icon">${a[0]}</div><div><div class="muted">${a[1]}</div><strong>${a[2]}</strong></div></div>`).join('');details.innerHTML=`<div class="report-line"><span>الفترة</span><b>${x.from} إلى ${x.to}</b></div><div class="report-line"><span>نسبة الحضور</span><b>${(Number(x.attended)+Number(x.absent))?Math.round(Number(x.attended)/(Number(x.attended)+Number(x.absent))*100):0}%</b></div>`}load.onclick=load;load();</script><button class="back-button" type="button" onclick="history.back()" title="رجوع">← رجوع</button></body></html>

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مريض جديد</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content full"><div class="topbar"><h1>➕ إضافة مريض</h1><button onclick="location.href='patients.html'">المرضى</button></div><form id="f" class="panel form-grid"><label>اسم المريض *<input name="full_name" required></label><label>الهاتف<input name="phone"></label><label>تاريخ الميلاد<input type="date" name="birth_date"></label><label>النوع<select name="gender"><option value="">اختر</option><option>ذكر</option><option>أنثى</option></select></label><label class="wide">العنوان<input name="address"></label><label class="wide">التشخيص<textarea name="diagnosis"></textarea></label><label class="wide">الشكوى الرئيسية<textarea name="chief_complaint"></textarea></label><label class="wide">التقييم الأولي<textarea name="initial_assessment"></textarea></label><label class="wide">خطة العلاج<textarea name="treatment_plan"></textarea></label><div class="wide alert-box"><b>⚠️ بيانات السلامة الطبية</b><span> أدخل أي معلومات مهمة يجب مراجعتها قبل الجلسة.</span></div><label>الحساسيات<textarea name="allergies"></textarea></label><label>موانع الاستعمال<textarea name="contraindications"></textarea></label><label>عمليات سابقة<textarea name="previous_surgery"></textarea></label><label>Red Flags<textarea name="red_flags"></textarea></label><div class="wide actions"><button type="button" onclick="history.back()">إلغاء</button><button class="primary">حفظ</button></div><div id="m" class="wide"></div></form><script>f.onsubmit=async e=>{e.preventDefault();const r=await window.physio.patients.add(Object.fromEntries(new FormData(f)));if(r.ok)location.href='patient.html?id='+r.id;else m.className='error',m.textContent=r.message}</script></main></body></html>

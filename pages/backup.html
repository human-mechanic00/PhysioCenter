<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>النسخ الاحتياطي</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content full"><div class="topbar"><h1>💾 النسخ الاحتياطي</h1><button onclick="location.href='dashboard.html'">الرئيسية</button></div><div class="panel"><h2>حفظ نسخة</h2><p class="muted">احفظ قاعدة البيانات كملف مستقل على جهازك.</p><button id="save" class="primary">حفظ نسخة احتياطية</button></div><div class="panel"><h2>استعادة نسخة</h2><p class="muted">بعد الاستعادة أغلق البرنامج وافتحه مرة أخرى.</p><button id="restore" class="ghost">استعادة</button></div><div id="m"></div><script>const u=JSON.parse(sessionStorage.getItem('physioUser')||'null');if(!u||u.role!=='doctor')location.href='dashboard.html';save.onclick=async()=>{const r=await window.physio.backup.create();m.textContent=r.message||'';m.className=r.ok?'success':'error'};restore.onclick=async()=>{if(!confirm('سيتم استبدال قاعدة البيانات الحالية. هل تريد المتابعة؟'))return;const r=await window.physio.backup.restore();m.textContent=r.message||'';m.className=r.ok?'success':'error'}</script></main><button class="back-button" type="button" onclick="history.back()" title="رجوع">← رجوع</button></body></html>

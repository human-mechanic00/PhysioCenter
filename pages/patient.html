<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ملف المريض</title><link rel="stylesheet" href="../css/style.css"></head><body><main class="content full"><div class="topbar"><div><h1 id="title">📋 ملف المريض</h1><span id="sub" class="muted"></span></div><div class="actions"><button onclick="location.href='patients.html'">المرضى</button><button onclick="window.print()">🖨️ طباعة الملف</button></div></div><div id="alert"></div><section class="panel" id="summary"></section><section class="panel"><div class="page-head"><h2>✏️ البيانات الطبية</h2><button id="editBtn">تعديل البيانات</button></div><form id="patientForm" class="form-grid hidden"><label>الاسم بالكامل<input name="full_name" required></label><label>الهاتف<input name="phone"></label><label>العمر<input name="age" type="number" min="0" max="120" placeholder="مثال: 35"></label><label>النوع<select name="gender"><option value="">اختر</option><option>ذكر</option><option>أنثى</option></select></label><label class="wide">العنوان<input name="address"></label><label class="wide">التشخيص<textarea name="diagnosis"></textarea></label><label class="wide">الشكوى الرئيسية<textarea name="chief_complaint"></textarea></label><label class="wide">التقييم الأولي<textarea name="initial_assessment"></textarea></label><label class="wide">خطة العلاج<textarea name="treatment_plan"></textarea></label><label>الحساسيات<textarea name="allergies"></textarea></label><label>موانع الاستعمال<textarea name="contraindications"></textarea></label><label>عمليات سابقة<textarea name="previous_surgery"></textarea></label><label>Red Flags<textarea name="red_flags"></textarea></label><div class="wide actions"><button class="primary">حفظ التعديلات</button><button type="button" id="cancelEdit">إلغاء</button></div><div id="editMsg" class="wide"></div></form></section><section class="panel"><div class="page-head"><div><h2>📈 خطة العلاج</h2><p class="muted">متابعة عدد الجلسات المنفذة والمتبقية</p></div></div><div id="progress"></div><div id="plans"></div><form id="plan" class="form-grid compact-form"><input type="hidden" name="patient_id"><label>عدد الجلسات<input name="total_sessions" type="number" min="1" required></label><label>سعر الجلسة<input name="session_price" type="number" min="0"></label><label>تاريخ البداية<input name="start_date" type="date"></label><div class="wide"><button class="primary">+ إضافة خطة</button></div></form></section><div class="grid2"><section class="panel"><h2>📝 إضافة جلسة</h2><form id="sess" class="form-grid"><input type="hidden" name="patient_id"><label>رقم الجلسة<input name="session_no" type="number" min="1" required></label><label>التاريخ<input name="session_date" type="date" required></label><label>المعالج<input name="therapist"></label><label>حالة المريض<select name="status_today"><option>تحسن</option><option>مستقر</option><option>أسوأ</option></select></label><label class="wide">ما تم عمله<textarea name="what_was_done"></textarea></label><label class="wide">التمارين<textarea name="exercises"></textarea></label><label class="wide">الاستجابة<textarea name="response"></textarea></label><label class="wide">النتيجة<textarea name="result"></textarea></label><label class="wide">ملاحظات<textarea name="notes"></textarea></label><label class="wide">خطة الجلسة القادمة<textarea name="next_plan"></textarea></label><div class="wide"><button class="primary">حفظ الجلسة</button></div></form></section><section class="panel"><h2>🏠 تمارين منزلية</h2><form id="exercise" class="form-grid"><input type="hidden" name="patient_id"><label>اسم التمرين<input name="exercise_name" required></label><label>المجموعات<input name="sets"></label><label>التكرارات<input name="reps"></label><label>المدة<input name="duration"></label><label>مرات يوميًا<input name="frequency"></label><label class="wide">ملاحظات<textarea name="notes"></textarea></label><div class="wide"><button class="primary">+ إضافة تمرين</button></div></form><div id="exercises"></div></section></div><section class="panel"><div class="page-head"><h2>🕘 الخط الزمني للجلسات</h2><button onclick="window.print()">طباعة التقرير</button></div><div id="sessions"></div></section></main><script src="../js/patient.js"></script><button class="back-button" type="button" onclick="history.back()" title="رجوع">← رجوع</button></body></html>

name: Build and Release PhysioCenter Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release upload "${{ github.ref_name }}" dist/PhysioCenter-Setup-latest.exe dist/latest.yml --clobber

      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhysioCenter-Windows-Installer
          path: dist/PhysioCenter-Setup-latest.exe
          if-no-files-found: error
          retention-days: 30
